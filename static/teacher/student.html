<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Student Oral Attempt Inspector — Review AI evaluations, 4-dimension rubrics, and execute manual score overrides.">
  <title>Student Attempt Review · Viva Simulator</title>

  <!-- Google Fonts Preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="/static/js/shared/theme.js"></script>
  <script src="/static/js/shared/toast.js"></script>
  <script src="/static/js/shared/auth.js"></script>
  <style>
    .student-meta-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .override-box {
      margin-top: 18px;
      padding: 16px;
      border-radius: var(--radius-md);
      background: var(--surface-elevated);
      border: 1px solid var(--border-active);
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a href="/" class="brand" aria-label="Viva Simulator Home">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span>viva<span class="brand-dot">.</span>simulator</span>
      </a>
      <div class="topbar-actions">
        <span class="badge badge-primary" id="teacherDisplay">Teacher Session</span>
        <button type="button" class="button button-quiet button-compact" onclick="history.back()">← Back</button>
        <button type="button" class="theme-toggle-btn" onclick="toggleTheme()">☀️ <span class="theme-btn-text">Light</span></button>
      </div>
    </header>

    <div class="student-meta-card">
      <div>
        <p class="eyebrow" id="assessmentTitle">VIVA ASSESSMENT</p>
        <h1 id="studentName" style="font-size: 26px;">Student <span>Attempt Evaluation</span></h1>
        <p id="studentDetails" style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Loading...</p>
      </div>
      <div style="text-align: right;">
        <span class="eyebrow">FINAL AGGREGATE</span>
        <div id="totalScoreText" style="font-family: var(--font-mono); font-size: 30px; font-weight: 900; color: var(--primary);">-- / --</div>
      </div>
    </div>

    <!-- Answers List -->
    <div id="answersListContainer" style="display: grid; gap: 16px;">
      <p style="color: var(--text-muted); padding: 20px;">Loading student answers and AI evaluations...</p>
    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const attemptId = urlParams.get("id");

    const assessmentTitle = document.getElementById("assessmentTitle");
    const studentName = document.getElementById("studentName");
    const studentDetails = document.getElementById("studentDetails");
    const totalScoreText = document.getElementById("totalScoreText");
    const answersListContainer = document.getElementById("answersListContainer");

    async function loadAttempt() {
      if (!attemptId) {
        window.location.href = "/teacher";
        return;
      }

      try {
        const res = await fetch(`/api/teacher/attempts/${attemptId}`);
        if (!res.ok) throw new Error("Student attempt not found");
        const data = await res.json();
        const a = data.attempt;

        assessmentTitle.textContent = (a.title || "VIVA ASSESSMENT").toUpperCase();
        studentName.textContent = a.student.name || "Student Attempt";

        const roll = a.student.roll_no ? `Roll No: ${a.student.roll_no}` : "";
        const started = a.started_at ? `Started: ${new Date(a.started_at).toLocaleTimeString()}` : "";
        const submitted = a.submitted_at ? `Submitted: ${new Date(a.submitted_at).toLocaleTimeString()}` : "";
        studentDetails.textContent = [roll, started, submitted].filter(Boolean).join(" · ");

        const answers = a.answers || [];
        const totalMarks = answers.reduce((acc, ans) => acc + (ans.marks || 0), 0);
        const earnedMarks = answers.reduce((acc, ans) => acc + (ans.final_score || 0), 0);
        totalScoreText.textContent = `${earnedMarks} / ${totalMarks}`;

        renderAnswers(answers);
      } catch (err) {
        answersListContainer.innerHTML = `<p style="color: var(--danger);">${err.message}</p>`;
      }
    }

    function renderAnswers(answers) {
      if (!answers.length) {
        answersListContainer.innerHTML = `<p style="color: var(--text-muted);">No answers submitted for this attempt.</p>`;
        return;
      }

      answersListContainer.innerHTML = answers.map((ans, idx) => {
        const evalObj = ans.evaluation || {};
        const isOverridden = Boolean(ans.override_reason);
        const dim = evalObj.dimension_scores;

        return `
          <div class="answer-review-card" id="answerCard-${ans.answer_id}">
            <div class="panel-heading-spread" style="margin-bottom: 12px;">
              <div style="display: flex; align-items: center; gap: 10px;">
                <span class="badge badge-primary">Q${idx + 1}</span>
                <span style="font-size: 15px; font-weight: 700; color: var(--text-primary);">${ans.question}</span>
              </div>
              <span class="badge badge-neutral" style="font-size: 13px; font-family: var(--font-mono);">${ans.final_score} / ${ans.marks} Marks</span>
            </div>

            <div style="margin: 14px 0;">
              <label>Student Verbal / Text Response</label>
              <div style="padding: 12px 14px; border-radius: var(--radius-sm); background: var(--surface-elevated); border: 1px solid var(--border); font-size: 13.5px; color: var(--text-primary); line-height: 1.5;">
                ${ans.student_answer ? escapeHtml(ans.student_answer) : '<em style="color: var(--text-muted);">[Blank / No response submitted]</em>'}
              </div>
            </div>

            ${dim ? `
              <div class="rubric-breakdown-grid" style="margin-bottom: 14px;">
                <div class="rubric-meter-card">
                  <div class="rubric-meter-header">
                    <span>Precision (20%)</span>
                    <span style="color: var(--primary);">${dim.precision} / ${dim.max_precision || (ans.marks*0.2)}</span>
                  </div>
                  <div class="rubric-meter-track"><div class="rubric-meter-fill" style="width: ${(dim.precision/(dim.max_precision||1))*100}%; background: var(--primary);"></div></div>
                </div>
                <div class="rubric-meter-card">
                  <div class="rubric-meter-header">
                    <span>Clarity (20%)</span>
                    <span style="color: var(--secondary);">${dim.clarity} / ${dim.max_clarity || (ans.marks*0.2)}</span>
                  </div>
                  <div class="rubric-meter-track"><div class="rubric-meter-fill" style="width: ${(dim.clarity/(dim.max_clarity||1))*100}%; background: var(--secondary);"></div></div>
                </div>
                <div class="rubric-meter-card">
                  <div class="rubric-meter-header">
                    <span>Evidence (20%)</span>
                    <span style="color: var(--accent-cyan);">${dim.evidence} / ${dim.max_evidence || (ans.marks*0.2)}</span>
                  </div>
                  <div class="rubric-meter-track"><div class="rubric-meter-fill" style="width: ${(dim.evidence/(dim.max_evidence||1))*100}%; background: var(--accent-cyan);"></div></div>
                </div>
                <div class="rubric-meter-card">
                  <div class="rubric-meter-header">
                    <span>Keywords (40%)</span>
                    <span style="color: var(--success);">${dim.keywords} / ${dim.max_keywords || (ans.marks*0.4)}</span>
                  </div>
                  <div class="rubric-meter-track"><div class="rubric-meter-fill" style="width: ${(dim.keywords/(dim.max_keywords||1))*100}%; background: var(--success);"></div></div>
                </div>
              </div>
            ` : ''}

            <div style="background: var(--surface-elevated); padding: 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-bottom: 14px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <span class="eyebrow" style="margin-bottom: 0;">AI EVALUATION &amp; RUBRIC FEEDBACK</span>
                <span style="font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--primary);">AI Score: ${ans.ai_score} / ${ans.marks}</span>
              </div>
              <p style="font-size: 13px; color: var(--text-secondary); line-height: 1.5;">${evalObj.feedback || "Pending evaluation."}</p>
            </div>

            <!-- Manual Override Tool -->
            <div class="override-box">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px;">
                <strong style="font-size: 13px; color: var(--text-primary);">Manual Mark Override &amp; Grade Adjustment</strong>
                ${isOverridden ? `<span class="badge badge-warning">Overridden: ${escapeHtml(ans.override_reason)}</span>` : ''}
              </div>

              <div class="field-row" style="margin-bottom: 10px;">
                <div>
                  <label style="font-size: 11.5px;">Final Score (Max: ${ans.marks})</label>
                  <input type="number" id="mark-${ans.answer_id}" value="${ans.final_score}" min="0" max="${ans.marks}" step="0.5">
                </div>
                <div>
                  <label style="font-size: 11.5px;">Teacher Audit Reason</label>
                  <input type="text" id="reason-${ans.answer_id}" placeholder="e.g. Accurate verbal explanation of deadlock prevention" value="${escapeHtml(ans.override_reason || '')}">
                </div>
              </div>

              <button type="button" class="button button-primary button-compact" onclick="saveOverride(${ans.answer_id})">
                Save Mark Override ✓
              </button>
              <span id="overrideStatus-${ans.answer_id}" style="font-size: 12px; margin-left: 10px; font-weight: 600;"></span>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text || "";
      return div.innerHTML;
    }

    window.saveOverride = async function(answerId) {
      const markInput = document.getElementById(`mark-${answerId}`);
      const reasonInput = document.getElementById(`reason-${answerId}`);
      const statusEl = document.getElementById(`overrideStatus-${answerId}`);

      const mark = parseFloat(markInput.value);
      const reason = reasonInput.value.trim();

      if (isNaN(mark)) {
        statusEl.textContent = "Please enter a valid numeric mark.";
        statusEl.style.color = "var(--danger)";
        if (window.Toast) Toast.error("Enter a valid numeric mark.");
        return;
      }

      if (!reason) {
        statusEl.textContent = "Please provide an audit reason for the mark change.";
        statusEl.style.color = "var(--danger)";
        if (window.Toast) Toast.warning("An audit reason is required for mark adjustments.");
        return;
      }

      statusEl.textContent = "Saving override...";
      statusEl.style.color = "var(--primary)";

      try {
        const res = await fetch(`/api/teacher/answers/${answerId}/override`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mark: mark,
            reason: reason
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Override failed");

        statusEl.textContent = "Mark updated successfully! ✓";
        statusEl.style.color = "var(--success)";
        if (window.Toast) Toast.success("Mark override saved with audit reason.");
        setTimeout(loadAttempt, 800);
      } catch (err) {
        statusEl.textContent = err.message;
        statusEl.style.color = "var(--danger)";
        if (window.Toast) Toast.error(err.message);
      }
    };

    document.addEventListener("DOMContentLoaded", loadAttempt);
  </script>
</body>
</html>
