<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Secure Professor and Teacher Access for Viva Simulator.">
  <title>Teacher Access · Viva Simulator</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/theme.js"></script>
  <script src="/static/toast.js"></script>
  <script src="/static/auth.js"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface-acrylic);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 38px 32px 34px;
      box-shadow: var(--shadow-lg), var(--shadow-glow);
    }

    .auth-tabs {
      display: flex;
      background: var(--surface-elevated);
      padding: 4px;
      border-radius: var(--radius-md);
      margin: 24px 0 20px;
      border: 1px solid var(--border-subtle);
    }

    .auth-tab-btn {
      flex: 1;
      padding: 9px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .auth-tab-btn.active {
      color: #ffffff;
      background: var(--primary);
      box-shadow: 0 2px 10px var(--primary-glow);
    }
  </style>
</head>
<body class="auth-page">
  <div style="margin-bottom: 24px; text-align: center;">
    <a href="/" class="brand" aria-label="Viva Simulator Home" style="font-size: 26px;">
      <span class="brand-mark" style="width: 32px; height: 32px;" aria-hidden="true"><span></span></span>
      <span>viva<span class="brand-dot">-simulator</span></span>
    </a>
  </div>

  <div class="auth-card">
    <div style="text-align: center;">
      <span class="eyebrow">Instructor Portal</span>
      <h1 id="authTitle" style="font-size: 24px; margin-top: 4px;">Sign In to Workspace</h1>
      <p id="authSubtitle" style="font-size: 13.5px; color: var(--text-muted); margin-top: 4px;">
        Manage oral assessments, question banks, and grading rubrics.
      </p>
    </div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab-btn active" id="tabLogin" onclick="switchAuthMode('login')">Sign In</button>
      <button type="button" class="auth-tab-btn" id="tabRegister" onclick="switchAuthMode('register')">Create Account</button>
    </div>

    <form id="authForm" onsubmit="handleAuthSubmit(event)">
      <div id="registerFields" style="display: none; margin-bottom: 14px;">
        <label for="displayName">Full Name / Academic Title</label>
        <input type="text" id="displayName" placeholder="e.g. Prof. Alan Turing">
      </div>

      <div style="margin-bottom: 14px;">
        <label for="email">Institutional Email</label>
        <input type="email" id="email" placeholder="teacher@university.edu" required>
      </div>

      <div style="margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label for="password" style="margin-bottom: 0;">Password</label>
          <span style="font-size: 11.5px; color: var(--text-muted); cursor: pointer;" onclick="togglePasswordVisibility()">Show</span>
        </div>
        <input type="password" id="password" placeholder="••••••••" required minlength="6">
      </div>

      <button type="submit" id="authSubmitBtn" class="button button-primary" style="width: 100%;">
        Sign In →
      </button>

      <div id="authErrorMessage" style="margin-top: 14px; color: var(--danger); font-size: 12.5px; font-weight: 600; text-align: center;"></div>
    </form>
  </div>

  <div style="margin-top: 24px; display: flex; align-items: center; gap: 16px;">
    <a href="/" style="font-size: 13px; color: var(--text-muted);">← Back to Gateway</a>
    <button type="button" class="theme-toggle-btn" onclick="toggleTheme()">☀️ <span class="theme-btn-text">Light</span></button>
  </div>

  <script>
    let authMode = "login";

    function switchAuthMode(mode) {
      authMode = mode;
      document.getElementById("tabLogin").classList.toggle("active", mode === "login");
      document.getElementById("tabRegister").classList.toggle("active", mode === "register");
      document.getElementById("registerFields").style.display = mode === "register" ? "block" : "none";
      document.getElementById("authTitle").textContent = mode === "register" ? "Create Teacher Account" : "Sign In to Workspace";
      document.getElementById("authSubtitle").textContent = mode === "register" ? "Set up your instructor workspace for assessments." : "Manage oral assessments, question banks, and grading rubrics.";
      document.getElementById("authSubmitBtn").textContent = mode === "register" ? "Create Account →" : "Sign In →";
      document.getElementById("authErrorMessage").textContent = "";
    }

    function togglePasswordVisibility() {
      const pass = document.getElementById("password");
      pass.type = pass.type === "password" ? "text" : "password";
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const errEl = document.getElementById("authErrorMessage");
      const btn = document.getElementById("authSubmitBtn");
      errEl.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password");
      const displayName = document.getElementById("displayName").value.trim();

      btn.disabled = true;
      btn.textContent = "Authenticating...";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: email,
            password: password.value,
            display_name: displayName
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Authentication failed.");
        }

        if (window.Toast) Toast.success("Authenticated successfully! Redirecting...");
        const params = new URLSearchParams(window.location.search);
        const next = params.get("redirect") || "/teacher";
        setTimeout(() => {
          window.location.href = next;
        }, 400);
      } catch (err) {
        errEl.textContent = err.message;
        btn.disabled = false;
        btn.textContent = authMode === "register" ? "Create Account →" : "Sign In →";
        if (window.Toast) Toast.error(err.message);
      }
    }
  </script>
</body>
</html>
