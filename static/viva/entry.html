<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Student Examination Intake — Enter credentials and PIN to begin your oral viva exam.">
  <title>Assessment Intake · Viva Simulator</title>

  <!-- Google Fonts Preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="/static/js/shared/theme.js"></script>
  <script src="/static/js/shared/toast.js"></script>
</head>
<body class="intake-page">
  <div style="margin-bottom: 24px; text-align: center;">
    <a href="/" class="brand" aria-label="Viva Simulator Home" style="font-size: 26px;">
      <span class="brand-mark" aria-hidden="true"><span></span></span>
      <span>viva<span class="brand-dot">.</span>simulator</span>
    </a>
  </div>

  <div class="intake-card">
    <div style="text-align: center; margin-bottom: 20px;">
      <span class="eyebrow" id="examSubject">ORAL EXAMINATION</span>
      <h1 id="examTitle" style="font-size: 24px; margin-top: 4px;">Loading assessment...</h1>
      <p id="examInstructions" style="font-size: 13.5px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5;"></p>
    </div>

    <div style="background: var(--surface-elevated); padding: 12px 16px; border-radius: var(--radius-md); border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <span style="font-size: 13px; color: var(--text-secondary);">Allocated Duration</span>
      <span id="examDurationBadge" class="badge badge-primary">⏱️ 20 mins</span>
    </div>

    <form id="intakeForm" onsubmit="handleStartExam(event)">
      <div id="dynamicStudentFields" style="display: grid; gap: 14px; margin-bottom: 16px;">
        <!-- Dynamic intake inputs -->
      </div>

      <div id="pinFieldWrapper" style="display: none; margin-bottom: 16px;">
        <label for="examPin">Assessment PIN Access Code</label>
        <input type="password" id="examPin" placeholder="Enter PIN code from professor...">
      </div>

      <button type="submit" id="startExamBtn" class="button button-primary" style="width: 100%; justify-content: center;">
        Begin Viva Examination →
      </button>

      <div id="intakeErrorMessage" style="margin-top: 14px; color: var(--danger); font-size: 12.5px; font-weight: 600; text-align: center;"></div>
    </form>
  </div>

  <script>
    const pathParts = window.location.pathname.split('/');
    const shareToken = pathParts[2];

    const examTitle = document.getElementById("examTitle");
    const examSubject = document.getElementById("examSubject");
    const examInstructions = document.getElementById("examInstructions");
    const examDurationBadge = document.getElementById("examDurationBadge");
    const dynamicStudentFields = document.getElementById("dynamicStudentFields");
    const pinFieldWrapper = document.getElementById("pinFieldWrapper");
    const examPin = document.getElementById("examPin");
    const startExamBtn = document.getElementById("startExamBtn");
    const intakeErrorMessage = document.getElementById("intakeErrorMessage");

    let vivaData = null;

    async function loadVivaDetails() {
      try {
        const res = await fetch(`/api/public/viva/${shareToken}`);
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || "Assessment unavailable.");
        }

        const data = await res.json();
        vivaData = data.viva;

        examTitle.textContent = vivaData.title;
        examSubject.textContent = (vivaData.subject || "VIVA").toUpperCase();
        examInstructions.textContent = vivaData.instructions || "Answer all questions comprehensively using structured technical reasoning.";
        examDurationBadge.textContent = `⏱️ ${vivaData.duration_minutes} mins`;

        if (vivaData.pin_required) {
          pinFieldWrapper.style.display = "block";
          examPin.required = true;
        }

        // Render intake fields
        const fields = vivaData.student_fields || [
          { key: "name", label: "Full Name", required: true },
          { key: "roll_no", label: "Roll / ID Number", required: true }
        ];

        dynamicStudentFields.innerHTML = fields.map(f => `
          <div>
            <label for="field_${f.key}">${f.label} ${f.required ? '<span style="color: var(--danger);">*</span>' : ''}</label>
            <input type="text" id="field_${f.key}" data-key="${f.key}" placeholder="Enter your ${f.label.toLowerCase()}..." ${f.required ? 'required' : ''}>
          </div>
        `).join('');
      } catch (err) {
        intakeErrorMessage.textContent = err.message;
        startExamBtn.disabled = true;
        if (window.Toast) Toast.error(err.message);
      }
    }

    async function handleStartExam(e) {
      e.preventDefault();
      intakeErrorMessage.textContent = "";
      startExamBtn.disabled = true;
      startExamBtn.textContent = "Entering Examination Room...";

      const studentData = {};
      dynamicStudentFields.querySelectorAll("input").forEach(input => {
        studentData[input.dataset.key] = input.value.trim();
      });

      try {
        const res = await fetch(`/api/public/viva/${shareToken}/start`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            student_data: studentData,
            pin: examPin.value.trim()
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Could not start exam");
        }

        window.location.href = data.exam_url;
      } catch (err) {
        intakeErrorMessage.textContent = err.message;
        startExamBtn.disabled = false;
        startExamBtn.textContent = "Begin Viva Examination →";
        if (window.Toast) Toast.error(err.message);
      }
    }

    document.addEventListener("DOMContentLoaded", loadVivaDetails);
  </script>
</body>
</html>
