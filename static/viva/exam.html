<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Proctored Viva Examination Stage — Oral response recording and answer submission.">
  <title>Viva Examination Stage · Viva Simulator</title>

  <!-- Google Fonts Preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="/static/js/shared/theme.js"></script>
  <script src="/static/js/shared/toast.js"></script>
  <style>
    .exam-stage {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 100px);
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a href="/" class="brand" aria-label="Viva Simulator Home">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span>viva<span class="brand-dot">.</span>simulator</span>
      </a>

      <!-- Synchronized Countdown Timer HUD -->
      <div style="display: flex; align-items: center; gap: 10px;">
        <span class="eyebrow" style="margin-bottom: 0;">TIME REMAINING:</span>
        <div id="examCountdown" style="font-family: var(--font-mono); font-size: 20px; font-weight: 900; color: var(--primary);">20:00</div>
      </div>

      <div class="topbar-actions">
        <button type="button" id="finishExamBtn" class="button button-danger button-compact" onclick="confirmFinishExam()">
          Finish &amp; Submit Exam ✓
        </button>
        <button type="button" class="theme-toggle-btn" onclick="toggleTheme()">☀️ <span class="theme-btn-text">Light</span></button>
      </div>
    </header>

    <div class="exam-stage">
      <div class="panel-heading-spread" style="margin: 16px 0 10px;">
        <div>
          <p class="eyebrow" id="examSubjectBadge">SUBJECT VIVA</p>
          <h1 id="examTitle" style="font-size: 22px;">Oral Examination HUD</h1>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <span id="studentIdentity" class="badge badge-neutral">Student</span>
          <button type="button" id="readExamQBtn" class="button button-secondary button-compact" onclick="readActiveQuestion()">
            🔊 Read Aloud
          </button>
        </div>
      </div>

      <!-- Question Stepper Dots -->
      <div class="stepper-nav" id="questionStepper">
        <!-- Injected dynamically -->
      </div>

      <!-- Active Question Box -->
      <section class="panel" style="flex-grow: 1; display: flex; flex-direction: column;">
        <div class="exam-question-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span class="eyebrow" id="currentQuestionLabel">QUESTION 1</span>
            <span id="currentQuestionMarks" class="badge badge-primary">10 Marks</span>
          </div>
          <h2 id="currentQuestionPrompt" style="font-size: 20px; line-height: 1.45; color: var(--text-primary);">
            Loading question...
          </h2>
        </div>

        <!-- Oral Speech / Textarea Input -->
        <div class="voice-input-wrapper" style="flex-grow: 1; margin-bottom: 16px;">
          <label for="examAnswerInput" style="display: flex; justify-content: space-between;">
            <span>Your Technical Oral Defense Response</span>
            <span id="examWordCount" style="font-family: var(--font-mono); color: var(--text-muted);">0 words</span>
          </label>
          <textarea id="examAnswerInput" placeholder="Speak your answer aloud via microphone or type your technical response here..."></textarea>
          <button type="button" id="voiceDictationBtn" class="voice-dictation-btn" data-target="examAnswerInput">
            🎙️ <span class="btn-text">Speak Answer</span>
          </button>
        </div>

        <!-- Navigation & Save Actions -->
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <span id="autoSaveIndicator" style="font-size: 12px; font-family: var(--font-mono); color: var(--text-muted);">Draft auto-saved</span>
          <div style="display: flex; gap: 10px;">
            <button type="button" id="prevQBtn" class="button button-quiet" onclick="navigateQuestion(-1)">← Previous</button>
            <button type="button" id="nextQBtn" class="button button-primary" onclick="navigateQuestion(1)">Next Question →</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="/static/js/student/focus-tools.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const attemptToken = urlParams.get("attempt");

    const examTitle = document.getElementById("examTitle");
    const examSubjectBadge = document.getElementById("examSubjectBadge");
    const studentIdentity = document.getElementById("studentIdentity");
    const questionStepper = document.getElementById("questionStepper");
    const currentQuestionLabel = document.getElementById("currentQuestionLabel");
    const currentQuestionMarks = document.getElementById("currentQuestionMarks");
    const currentQuestionPrompt = document.getElementById("currentQuestionPrompt");
    const examAnswerInput = document.getElementById("examAnswerInput");
    const examWordCount = document.getElementById("examWordCount");
    const autoSaveIndicator = document.getElementById("autoSaveIndicator");
    const prevQBtn = document.getElementById("prevQBtn");
    const nextQBtn = document.getElementById("nextQBtn");
    const examCountdown = document.getElementById("examCountdown");
    const readExamQBtn = document.getElementById("readExamQBtn");

    let questions = [];
    let currentIdx = 0;
    let autoSaveTimer = null;
    let countdownInterval = null;

    async function loadExam() {
      if (!attemptToken) {
        if (window.Toast) Toast.error("Missing attempt access token.");
        setTimeout(() => { window.location.href = "/"; }, 1500);
        return;
      }

      try {
        const res = await fetch(`/api/public/attempts/${attemptToken}`);
        if (!res.ok) throw new Error("Attempt not found or invalid");
        const data = await res.json();
        const a = data.attempt;

        if (a.state === "submitted") {
          window.location.href = `/viva/complete?attempt=${attemptToken}`;
          return;
        }

        examTitle.textContent = a.title;
        examSubjectBadge.textContent = (a.subject || "VIVA").toUpperCase();
        studentIdentity.textContent = a.student.name || "Student Attempt";

        questions = a.questions || [];
        renderStepper();
        showQuestion(0);

        // Persistent timer sync
        const remainingSecs = a.remaining_seconds !== undefined ? a.remaining_seconds : (a.duration_minutes * 60);
        startTimer(remainingSecs);
      } catch (err) {
        if (window.Toast) Toast.error(err.message);
      }
    }

    function renderStepper() {
      questionStepper.innerHTML = questions.map((q, idx) => `
        <div class="step-dot ${idx === currentIdx ? 'active' : ''} ${q.answer ? 'completed' : ''}" onclick="showQuestion(${idx})">
          ${idx + 1}
        </div>
      `).join('');
    }

    function showQuestion(idx) {
      if (idx < 0 || idx >= questions.length) return;
      saveCurrentDraft();

      currentIdx = idx;
      const q = questions[idx];

      currentQuestionLabel.textContent = `QUESTION ${idx + 1} OF ${questions.length}`;
      currentQuestionMarks.textContent = `${q.marks} Marks`;
      currentQuestionPrompt.textContent = q.question;
      examAnswerInput.value = q.answer || "";
      updateWordCount();

      prevQBtn.disabled = idx === 0;
      nextQBtn.textContent = idx === questions.length - 1 ? "Review Answers" : "Next Question →";

      renderStepper();
      if (window.stopExaminerSpeech) window.stopExaminerSpeech();
    }

    function readActiveQuestion() {
      const q = questions[currentIdx];
      if (!q) return;
      readExamQBtn.disabled = true;
      readExamQBtn.textContent = "🔊 Reading...";
      if (window.speakExaminerQuestion) {
        window.speakExaminerQuestion(q.question, () => {
          readExamQBtn.disabled = false;
          readExamQBtn.textContent = "🔊 Read Aloud";
        });
      }
    }

    function navigateQuestion(offset) {
      const nextIdx = currentIdx + offset;
      if (nextIdx >= 0 && nextIdx < questions.length) {
        showQuestion(nextIdx);
      }
    }

    examAnswerInput.addEventListener("input", () => {
      questions[currentIdx].answer = examAnswerInput.value;
      updateWordCount();
      autoSaveIndicator.textContent = "Saving draft...";
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(saveCurrentDraft, 1000);
    });

    function updateWordCount() {
      const words = examAnswerInput.value.trim().split(/\s+/).filter(Boolean).length;
      examWordCount.textContent = `${words} word${words === 1 ? '' : 's'}`;
    }

    async function saveCurrentDraft() {
      if (!questions[currentIdx]) return;
      const q = questions[currentIdx];
      try {
        await fetch(`/api/public/attempts/${attemptToken}/answers`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question_id: q.id,
            answer: examAnswerInput.value
          })
        });
        autoSaveIndicator.textContent = "✓ Draft auto-saved";
        renderStepper();
      } catch (_) {}
    }

    function startTimer(initialSeconds) {
      let secondsLeft = initialSeconds;
      countdownInterval = setInterval(() => {
        secondsLeft--;
        if (secondsLeft <= 0) {
          clearInterval(countdownInterval);
          examCountdown.textContent = "00:00";
          if (window.Toast) Toast.warning("Time has expired! Submitting your examination answers now...", 5000);
          submitExam();
          return;
        }

        const mins = Math.floor(secondsLeft / 60);
        const secs = secondsLeft % 60;
        examCountdown.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        if (secondsLeft < 300) {
          examCountdown.style.color = "var(--danger)";
        }
      }, 1000);
    }

    async function confirmFinishExam() {
      const unanswered = questions.filter(q => !(q.answer || "").trim()).length;
      let msg = "Are you sure you want to finish and submit your viva examination?";
      if (unanswered > 0) {
        msg = `You have ${unanswered} unanswered question${unanswered === 1 ? '' : 's'}. Are you sure you want to submit?`;
      }

      const confirmed = await Modal.confirm("Submit Examination", msg, { confirmText: "Finish & Submit" });
      if (confirmed) {
        await submitExam();
      }
    }

    async function submitExam() {
      await saveCurrentDraft();
      const finishBtn = document.getElementById("finishExamBtn");
      finishBtn.disabled = true;
      finishBtn.textContent = "Grading & Submitting...";

      try {
        const res = await fetch(`/api/public/attempts/${attemptToken}/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" }
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Submission failed");
        }

        window.location.href = data.result_url;
      } catch (err) {
        if (window.Toast) Toast.error(err.message);
        finishBtn.disabled = false;
        finishBtn.textContent = "Finish & Submit Exam ✓";
      }
    }

    document.addEventListener("DOMContentLoaded", loadExam);
  </script>
</body>
</html>
